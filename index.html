<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Valoració del menjar</title>


    
</head>

<body>

<div class="container">

    <h1>Valora el menjar</h1>

    <div class="subtitle">
        Només et prendrà uns segons
    </div>

    <div class="question">
        Quin àpat vols valorar?
    </div>

    <select id="meal">
        <option value="">
            Selecciona...
        </option>

        <option value="Esmorzar">
            Esmorzar
        </option>

        <option value="Dinar">
            Dinar
        </option>

        <option value="Sopar">
            Sopar
        </option>
    </select>

    <div class="question">
        Grau de satisfacció general amb el menjar d'avui
    </div>

    <div class="slider-container">

    <div class="slider-value">
        <span id="sliderValue">5</span>
        <span>/ 10</span>
    </div>

    <input
        type="range"
        id="scoreSlider"
        min="1"
        max="10"
        value="5"
        step="1"
    >

</div>

    <div class="labels">
        <span>1 · Molt dolent</span>
        <span>10 · Excel·lent</span>
    </div>

    <div class="question">
        Comentari (opcional)

    </div>

    <textarea
        id="comment"
        placeholder="Escriu el teu comentari aquí..."
        rows="5">  
    </textarea>

    <button
        class="submit"
        id="submit"
        disabled>
        Enviar valoració
    </button>

    <div id="success">
        ✓ Gràcies per la teva valoració!
    </div>

</div>

<footer>
    <div class="footer">
        <p>
            ComiMenjador 2026       -        Col·legi Major Penyafort-Montserrat
        </p>
    </div>
</footer>

<script>
const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwnpvz1oPMxSxLYOq-8LpWnhuGwkQxHWeFz_iUoLXz8Abdb30EhL4C5EozH4q0-kQdP/exec";


let selectedScore = "5";


const scoreSlider =
    document.getElementById("scoreSlider");

const sliderValue =
    document.getElementById("sliderValue");

const meal =
    document.getElementById("meal");

const submit =
    document.getElementById("submit");


// Mostrar el valor inicial
sliderValue.textContent = selectedScore;


// Cambiar número al mover el slider
scoreSlider.addEventListener("input", function () {

    selectedScore = scoreSlider.value;

    sliderValue.textContent = selectedScore;

    checkForm();

});


// Comprobar formulario
meal.addEventListener(
    "change",
    checkForm
);


function checkForm() {

    if (
        meal.value !== "" &&
        selectedScore !== null
    ) {

        submit.disabled = false;

    } else {

        submit.disabled = true;

    }

}


// Enviar valoración
submit.addEventListener(
    "click",
    function () {

        submit.disabled = true;

        submit.textContent =
            "Enviant...";


        const data =
            new URLSearchParams();


        data.append(
            "meal",
            meal.value
        );


        data.append(
            "score",
            selectedScore
        );


        const comment =
            document.getElementById("comment");


        if (comment) {

            data.append(
                "comment",
                comment.value
            );

        }


        fetch(
            SCRIPT_URL,
            {
                method: "POST",
                body: data
            }
        )
        .then(function () {

            document.querySelector(
                ".container"
            ).innerHTML = `

                <h1>✓ Gràcies!</h1>

                <p>
                    La teva valoració s'ha registrat.
                </p>

                <p>
                    Gràcies per participar.
                </p>

            `;

        })
        .catch(function (error) {

            console.error(
                "Error:",
                error
            );

            submit.disabled = false;

            submit.textContent =
                "Enviar valoració";

            alert(
                "No s'ha pogut enviar la valoració. Torna-ho a provar."
            );

        });

    }
);
</script>

<br>

</body>
</html>
