<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    

    <title>Valoració del menjar</title>


    
</head>

<body>

<div class="container">

    <h1>Valora el menjar</h1>

    <div class="subtitle">
        Només et prendrà uns segons
    </div>

    <div class="question">
        Quin àpat vols valorar?
    </div>

    <select id="meal">
        <option value="">
            Selecciona...
        </option>

        <option value="Esmorzar">
            Esmorzar
        </option>

        <option value="Dinar">
            Dinar
        </option>

        <option value="Sopar">
            Sopar
        </option>
    </select>

    <div class="question">
        Grau de satisfacció general amb el menjar d'avui
    </div>

    <div class="slider-container">

    <div class="slider-value">
        <span id="sliderValue">5</span>
        <span>/ 10</span>
    </div>

    <input
        type="range"
        id="scoreSlider"
        min="1"
        max="10"
        value="5"
        step="1"
    >

</div>

    <div class="labels">
        <span>1 · Molt dolent</span>
        <span>10 · Excel·lent</span>
    </div>

    <div class="question">
        Comentari (opcional)

    </div>

    <textarea
        id="comment"
        placeholder="Escriu el teu comentari aquí..."
        rows="5">  
    </textarea>

    <button
        class="submit"
        id="submit"
        disabled>
        Enviar valoració
    </button>

    <div id="success">
        ✓ Gràcies per la teva valoració!
    </div>

</div>

<footer>
    <div class="footer">
        <p>
            ComiMenjador 2026       -        Col·legi Major Penyafort-Montserrat
        </p>
    </div>
</footer>

<script src="script.js">

</script>
<br>

</body>
</html>
